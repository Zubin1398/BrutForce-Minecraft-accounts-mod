<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Схема интерфейса AuthProbe: профиль ника и пароли слева, параметры и чат сервера справа">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d14"/>
      <stop offset="1" stop-color="#0d2033"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#142838" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="640" rx="24" fill="url(#grid)"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffd700">AuthProbe</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <!-- left column -->
    <text x="48" y="84" fill="#ffd700">Адрес сервера</text>
    <rect x="48" y="92" width="530" height="30" rx="4" fill="#050b11" stroke="#3c5a78"/>
    <text x="58" y="112" font-family="Consolas, monospace" font-weight="400" fill="#e6f1ff">play.example.com:25565</text>

    <text x="48" y="150" fill="#ffd700">Ник (2/3)</text>
    <rect x="48" y="158" width="438" height="30" rx="4" fill="#050b11" stroke="#3c5a78"/>
    <text x="58" y="178" font-family="Consolas, monospace" font-weight="400" fill="#e6f1ff">Alex</text>
    <g font-family="Consolas, monospace" font-size="15">
      <rect x="494" y="158" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="507" y="178" text-anchor="middle" fill="#e6f1ff">&lt;</text>
      <rect x="524" y="158" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="537" y="178" text-anchor="middle" fill="#e6f1ff">&gt;</text>
      <rect x="554" y="158" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="567" y="178" text-anchor="middle" fill="#9af0c4">+</text>
      <rect x="584" y="158" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="597" y="178" text-anchor="middle" fill="#fca5a5">-</text>
    </g>

    <text x="48" y="216" fill="#ffd700">Пароли (по одному в строке)</text>
    <rect x="48" y="224" width="530" height="254" rx="4" fill="#050b11" stroke="#3c5a78"/>
    <g font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#e0e0e0">
      <text x="60" y="252">qwerty</text>
      <text x="60" y="276">123456</text>
      <text x="60" y="300">hunter2</text>
      <text x="60" y="324">password</text>
      <text x="60" y="348" fill="#fbbf24">letmein</text>
    </g>

    <text x="48" y="506" fill="#ffd700">Последний: Alex / 123456</text>
    <text x="48" y="528" fill="#c0c0c0">Состояние: ждём ответ сервера</text>
    <text x="48" y="548" fill="#d0d0d0">паролей: 5 / 2048</text>
    <text x="48" y="568" fill="#9af0c4">адрес: ок</text>
    <text x="140" y="568" fill="#9af0c4">ник: ок</text>

    <!-- right column -->
    <text x="628" y="84" fill="#ffd700">Параметры</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="628" y="92" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="110" fill="#e6f1ff">Вход: /l &lt;пароль&gt;</text>
      <rect x="628" y="122" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="140" fill="#e6f1ff">Пауза: 200 мс</text>
      <rect x="628" y="152" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="170" fill="#e6f1ff">Реконнект: 8 с</text>
      <rect x="628" y="182" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="200" fill="#e6f1ff">Авто-старт: выкл</text>
      <rect x="628" y="212" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="230" fill="#e6f1ff">Авто-реконнект: вкл</text>
      <rect x="628" y="242" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="260" fill="#e6f1ff">Debug-логи: выкл</text>
      <rect x="628" y="272" width="496" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="290" fill="#e6f1ff">Прокси: вкл</text>
      <rect x="1130" y="272" width="22" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="1141" y="290" text-anchor="middle" fill="#e6f1ff">...</text>
    </g>

    <text x="628" y="330" fill="#ffd700">Чат сервера</text>
    <rect x="624" y="338" width="532" height="140" rx="4" fill="#050b11" stroke="#3c5a78"/>
    <g font-family="Consolas, monospace" font-size="13" font-weight="400">
      <text x="636" y="360" fill="#e0e0e0">[Server] Добро пожаловать на сервер!</text>
      <text x="636" y="376" fill="#e0e0e0">[Server] Пожалуйста, авторизуйтесь:</text>
      <text x="636" y="392" fill="#e0e0e0">/login &lt;пароль&gt; — вход, /reg — регистрация.</text>
      <text x="636" y="412" fill="#e0e0e0">[Server] Длинное сообщение автоматически переносится</text>
      <text x="636" y="428" fill="#e0e0e0">по ширине панели, а история прокручивается</text>
      <text x="636" y="444" fill="#e0e0e0">колесом мыши — ползунок справа.</text>
      <text x="636" y="464" fill="#ffd166">[AuthProbe] attempt 2/5: &lt;123456&gt;</text>
    </g>
    <rect x="1148" y="338" width="4" height="140" rx="2" fill="#1f3346"/>
    <rect x="1148" y="400" width="4" height="46" rx="2" fill="#88ccff"/>

    <rect x="1060" y="484" width="92" height="22" rx="4" fill="#1b2a38" stroke="#3c5a78"/>
    <text x="1106" y="499" text-anchor="middle" font-size="12" fill="#e6f1ff">Очистить чат</text>

    <!-- bottom row -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="140" y="596" width="200" height="30" rx="4" fill="#1f4d36" stroke="#34d399"/><text x="240" y="616" text-anchor="middle" fill="#c9ffe2">Начать</text>
      <rect x="352" y="596" width="200" height="30" rx="4" fill="#4a1f25" stroke="#f87171"/><text x="452" y="616" text-anchor="middle" fill="#ffd1d1">Стоп</text>
      <rect x="564" y="596" width="200" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="664" y="616" text-anchor="middle" fill="#e6f1ff">Шаблоны</text>
      <rect x="776" y="596" width="200" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="876" y="616" text-anchor="middle" fill="#e6f1ff">В меню</text>
    </g>
  </g>
</svg>