<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Схема интерфейса AuthProbe 1.6.0: список серверов, профиль, метка 2FA, умная задержка, прокси и чат с логами">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d14"/>
      <stop offset="1" stop-color="#0d2033"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#142838" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="700" rx="24" fill="url(#grid)"/>
  <text x="600" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffd700">AuthProbe 1.6.0</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <!-- left column -->
    <text x="48" y="84" fill="#ffd700">Адрес сервера (1/2)</text>
    <rect x="48" y="92" width="418" height="30" rx="4" fill="#050b11" stroke="#3c5a78"/>
    <text x="58" y="112" font-family="Consolas, monospace" font-weight="400" fill="#e6f1ff">play.example.com:25565</text>
    <g font-family="Consolas, monospace" font-size="15">
      <rect x="474" y="92" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="487" y="112" text-anchor="middle" fill="#e6f1ff">&lt;</text>
      <rect x="504" y="92" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="517" y="112" text-anchor="middle" fill="#e6f1ff">&gt;</text>
      <rect x="534" y="92" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="547" y="112" text-anchor="middle" fill="#9af0c4">+</text>
      <rect x="564" y="92" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="577" y="112" text-anchor="middle" fill="#fca5a5">-</text>
    </g>

    <text x="48" y="150" fill="#ffd700">Ник (2/3)</text>
    <text x="126" y="150" font-size="12" fill="#ff6666">2FA</text>
    <rect x="158" y="138" width="16" height="16" rx="3" fill="#1b2a38" stroke="#7a6a2a"/>
    <text x="166" y="150" text-anchor="middle" font-size="12" fill="#ffd700">×</text>
    <rect x="48" y="158" width="418" height="30" rx="4" fill="#050b11" stroke="#3c5a78"/>
    <text x="58" y="178" font-family="Consolas, monospace" font-weight="400" fill="#e6f1ff">Alex</text>
    <g font-family="Consolas, monospace" font-size="15">
      <rect x="474" y="158" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="487" y="178" text-anchor="middle" fill="#e6f1ff">&lt;</text>
      <rect x="504" y="158" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="517" y="178" text-anchor="middle" fill="#e6f1ff">&gt;</text>
      <rect x="534" y="158" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="547" y="178" text-anchor="middle" fill="#9af0c4">+</text>
      <rect x="564" y="158" width="26" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="577" y="178" text-anchor="middle" fill="#fca5a5">-</text>
      <rect x="594" y="158" width="26" height="30" rx="4" fill="#3a1820" stroke="#f87171"/><text x="607" y="178" text-anchor="middle" fill="#ff6666">X</text>
    </g>

    <text x="48" y="216" fill="#ffd700">Пароли (по одному в строке)</text>
    <rect x="48" y="224" width="530" height="254" rx="4" fill="#050b11" stroke="#3c5a78"/>
    <g font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#e0e0e0">
      <text x="60" y="252">qwerty</text>
      <text x="60" y="276">123456</text>
      <text x="60" y="300">hunter2</text>
      <text x="60" y="324">password</text>
      <text x="60" y="348" fill="#fbbf24">letmein</text>
    </g>

    <text x="48" y="506" fill="#ffd700">Последний: Alex / 123456</text>
    <text x="48" y="528" fill="#c0c0c0">Состояние: ждём ответ сервера</text>
    <text x="48" y="548" fill="#d0d0d0">паролей: 5 / 2048</text>
    <text x="48" y="568" fill="#9af0c4">адрес: ок</text>
    <text x="140" y="568" fill="#9af0c4">ник: ок</text>
    <text x="48" y="592" font-size="11" font-weight="400" fill="#7f8fa3">метки ников: 2FA · неверный ник · был онлайн · дата</text>

    <!-- right column -->
    <text x="628" y="84" fill="#ffd700">Параметры</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="628" y="92" width="524" height="26" rx="4" fill="#10281f" stroke="#34d399"/><text x="638" y="110" fill="#e6f1ff">Мод: <tspan fill="#55ff88">вкл</tspan></text>
      <rect x="628" y="122" width="524" height="26" rx="4" fill="#2a161b" stroke="#7a3b45"/><text x="638" y="140" fill="#e6f1ff">Макрос .start/.go: <tspan fill="#ff7777">выкл</tspan></text>
      <rect x="628" y="152" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="170" fill="#e6f1ff">Вход: /l &lt;пароль&gt;</text>
      <rect x="628" y="182" width="524" height="26" rx="4" fill="#10281f" stroke="#34d399"/><text x="638" y="200" fill="#e6f1ff">Умная задержка: <tspan fill="#55ff88">вкл</tspan></text>
      <rect x="628" y="212" width="524" height="26" rx="4" fill="#101820" stroke="#26323c"/><text x="638" y="230" fill="#6b7785">Пауза: 1200 мс</text><text x="1090" y="230" text-anchor="end" font-size="11" fill="#566270">неактивна</text>
      <rect x="628" y="242" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="260" fill="#e6f1ff">Реконнект: 8 с</text>
      <rect x="628" y="272" width="524" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="638" y="290" fill="#e6f1ff">Авто-старт: <tspan fill="#ff7777">выкл</tspan></text>
      <rect x="628" y="302" width="524" height="26" rx="4" fill="#10281f" stroke="#34d399"/><text x="638" y="320" fill="#e6f1ff">Debug-логи: <tspan fill="#55ff88">вкл</tspan></text>
      <rect x="628" y="332" width="496" height="26" rx="4" fill="#10281f" stroke="#34d399"/><text x="638" y="350" fill="#e6f1ff">Прокси: <tspan fill="#55ff88">вкл</tspan></text>
      <rect x="1130" y="332" width="22" height="26" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="1141" y="350" text-anchor="middle" fill="#e6f1ff">...</text>
      <rect x="628" y="362" width="524" height="26" rx="4" fill="#10281f" stroke="#34d399"/><text x="638" y="380" fill="#e6f1ff">Авто-реконнект: <tspan fill="#55ff88">вкл</tspan></text>
    </g>

    <text x="628" y="404" fill="#ffd700">Чат сервера</text>
    <rect x="624" y="412" width="532" height="188" rx="4" fill="#050b11" stroke="#3c5a78"/>
    <g font-family="Consolas, monospace" font-size="13" font-weight="400">
      <text x="636" y="434" fill="#e0e0e0">[Server] Пожалуйста, авторизуйтесь: /login &lt;пароль&gt;</text>
      <text x="636" y="452" fill="#e0e0e0">[Server] Длинные строки переносятся по ширине</text>
      <text x="636" y="470" fill="#e0e0e0">панели, история листается колесом и ползунком.</text>
      <text x="636" y="492" fill="#ffd166">[AuthProbe] nick #2/3 · password #3/5: &lt;hunter2&gt;</text>
      <text x="636" y="510" fill="#ffd166">[AuthProbe] сервер просит паузу 30 с — повтор #3/5</text>
      <text x="636" y="532" fill="#88ccff">[AuthProbe] Прокси: №2/10 socks5://...</text>
    </g>
    <rect x="1148" y="412" width="4" height="188" rx="2" fill="#1f3346"/>
    <rect x="1148" y="452" width="4" height="52" rx="2" fill="#88ccff"/>

    <rect x="960" y="604" width="94" height="22" rx="4" fill="#10281f" stroke="#34d399"/>
    <text x="1007" y="619" text-anchor="middle" font-size="12" fill="#55ff88">Только логи</text>
    <rect x="1060" y="604" width="92" height="22" rx="4" fill="#1b2a38" stroke="#3c5a78"/>
    <text x="1106" y="619" text-anchor="middle" font-size="12" fill="#e6f1ff">Очистить чат</text>
    <text x="628" y="642" font-size="11" font-weight="400" fill="#7f8fa3">буфер 200 строк · клик по строке → «Добавить в шаблоны»</text>

    <!-- bottom row -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="76" y="650" width="196" height="30" rx="4" fill="#1f4d36" stroke="#34d399"/><text x="174" y="670" text-anchor="middle" fill="#55ff88">Начать</text>
      <rect x="284" y="650" width="196" height="30" rx="4" fill="#4a1f25" stroke="#f87171"/><text x="382" y="670" text-anchor="middle" fill="#ff7777">Стоп</text>
      <rect x="492" y="650" width="196" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="590" y="670" text-anchor="middle" fill="#e6f1ff">Импорт .txt</text>
      <rect x="700" y="650" width="196" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="798" y="670" text-anchor="middle" fill="#e6f1ff">Шаблоны</text>
      <rect x="908" y="650" width="196" height="30" rx="4" fill="#1b2a38" stroke="#3c5a78"/><text x="1006" y="670" text-anchor="middle" fill="#e6f1ff">В меню</text>
    </g>
  </g>
</svg>